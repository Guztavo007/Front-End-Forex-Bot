<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forex AutoTrader PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Forex AutoTrader PRO</h1>
  </header>

  <!-- Alerts Settings Panel -->
  <section class="mb-8 bg-gray-800 p-6 rounded-lg">
    <h2 class="text-2xl font-semibold mb-4">Notification Settings</h2>
    <form id="alerts-form" class="space-y-4">
      <div class="flex items-center">
        <input type="checkbox" id="alerts-enabled" class="mr-2">
        <label for="alerts-enabled">Enable Discord Alerts</label>
      </div>
      <div class="ml-4 space-y-2">
        <div class="flex items-center">
          <input type="checkbox" id="alert-trades" class="mr-2">
          <label for="alert-trades">Trade Actions (BUY/SELL)</label>
        </div>
        <div class="flex items-center">
          <input type="checkbox" id="alert-holds" class="mr-2">
          <label for="alert-holds">HOLD Decisions</label>
        </div>
        <div class="flex items-center">
          <input type="checkbox" id="alert-errors" class="mr-2">
          <label for="alert-errors">Errors or Skipped Trades</label>
        </div>
      </div>
      <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Save Alerts Settings</button>
    </form>
  </section>

  <script>
    const alertsKey = "alerts-settings";

    function loadAlertSettings() {
      const saved = localStorage.getItem(alertsKey);
      if (saved) {
        const parsed = JSON.parse(saved);
        document.getElementById("alerts-enabled").checked = parsed.enabled;
        document.getElementById("alert-trades").checked = parsed.trades;
        document.getElementById("alert-holds").checked = parsed.holds;
        document.getElementById("alert-errors").checked = parsed.errors;
      }
    }

    function saveAlertSettings(e) {
      e.preventDefault();
      const settings = {
        enabled: document.getElementById("alerts-enabled").checked,
        trades: document.getElementById("alert-trades").checked,
        holds: document.getElementById("alert-holds").checked,
        errors: document.getElementById("alert-errors").checked
      };
      localStorage.setItem(alertsKey, JSON.stringify(settings));
      alert("Alert settings saved.");
    }

    document.getElementById("alerts-form").addEventListener("submit", saveAlertSettings);
    document.addEventListener("DOMContentLoaded", loadAlertSettings);
  </script>
</body>
</html>
