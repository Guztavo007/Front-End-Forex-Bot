
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forex AutoTrader PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Forex AutoTrader PRO</h1>
        <button id="run-bot" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
            Run Bot Now
        </button>
    </header>

    <p id="run-status" class="mb-6 text-sm text-green-400"></p>

    <!-- Trade History -->
    <section class="mb-8">
        <h2 class="text-2xl font-semibold mb-2">Trade History</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-800 rounded-lg overflow-hidden">
                <thead class="bg-gray-700">
                    <tr>
                        <th class="px-4 py-2 text-left">Symbol</th>
                        <th class="px-4 py-2 text-left">Action</th>
                        <th class="px-4 py-2 text-left">Price</th>
                        <th class="px-4 py-2 text-left">Timestamp</th>
                    </tr>
                </thead>
                <tbody id="trade-history" class="divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </section>

    <!-- Placeholder for additional UI -->
    <section class="bg-gray-800 p-6 rounded-lg">
        <h3 class="text-xl font-bold mb-4">Dashboard Overview</h3>
        <p class="text-gray-400">Your dashboard components like charts, account summary, signals, etc., can be added below this section.</p>
    </section>

    <script>
        const backendUrl = "https://forexbot-backend.onrender.com";

        // Load trade history
        async function loadTrades() {
            try {
                const res = await fetch(backendUrl + "/trades");
                const trades = await res.json();
                const table = document.getElementById("trade-history");
                table.innerHTML = "";
                trades.reverse().forEach(t => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td class="px-4 py-2">{t.symbol}</td>
                        <td class="px-4 py-2 text-${t.action === 'buy' ? 'green' : 'red'}-400 font-bold">{t.action.toUpperCase()}</td>
                        <td class="px-4 py-2">{t.price.toFixed(5)}</td>
                        <td class="px-4 py-2">{new Date(t.timestamp).toLocaleString()}</td>
                    `;
                    table.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading trades:", err);
            }
        }

        // Handle "Run Bot Now" click
        document.getElementById("run-bot").addEventListener("click", async () => {
            const status = document.getElementById("run-status");
            status.textContent = "Running bot...";
            try {
                const res = await fetch(backendUrl + "/run", { method: "POST" });
                const data = await res.json();
                const action = data.trade?.action?.toUpperCase() || "HOLD";
                status.textContent = "Bot executed: " + action;
                loadTrades(); // refresh trade history
            } catch (err) {
                status.textContent = "Error running bot.";
                console.error(err);
            }
        });

        // Initial load
        loadTrades();
    </script>
</body>
</html>
