
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forex Bot UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
  <div class="flex items-center gap-4 mb-4">
    <select id="symbol-select" class="text-black p-2 rounded">
      <option value="EURUSD">EUR/USD</option>
      <option value="USDJPY">USD/JPY</option>
    </select>
    <button onclick="runBot()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Run Bot Now</button>
  </div>
  <script>
    async function runBot() {
      const symbol = document.getElementById("symbol-select").value;
      const alerts = JSON.parse(localStorage.getItem("alerts-settings") || "{}");
      const payload = { symbol, alerts };
      console.log("Running bot with:", payload);
      await fetch("https://forexbot-backend.onrender.com/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }
  </script>
</body>
</html>
