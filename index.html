
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forex Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-3xl font-bold mb-4">Forex Bot Dashboard</h1>

    <!-- Run Bot Button -->
    <button id="run-bot" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded mb-4">Run Bot Now</button>
    <p id="run-status" class="mb-6"></p>

    <!-- Trade History Table -->
    <h2 class="text-2xl font-semibold mb-2">Trade History</h2>
    <table class="min-w-full bg-gray-800 rounded">
        <thead>
            <tr class="bg-gray-700">
                <th class="py-2 px-4 text-left">Symbol</th>
                <th class="py-2 px-4 text-left">Action</th>
                <th class="py-2 px-4 text-left">Price</th>
                <th class="py-2 px-4 text-left">Timestamp</th>
            </tr>
        </thead>
        <tbody id="trade-history"></tbody>
    </table>

    <script>
        const backendUrl = "https://forexbot-backend.onrender.com";

        // Fetch and display trade history
        async function loadTrades() {
            try {
                const res = await fetch(backendUrl + "/trades");
                const trades = await res.json();
                const table = document.getElementById("trade-history");
                table.innerHTML = "";
                trades.reverse().forEach(t => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td class="py-2 px-4 border-b border-gray-700">{t.symbol}</td>
                        <td class="py-2 px-4 border-b border-gray-700">{t.action.toUpperCase()}</td>
                        <td class="py-2 px-4 border-b border-gray-700">{t.price.toFixed(5)}</td>
                        <td class="py-2 px-4 border-b border-gray-700">{new Date(t.timestamp).toLocaleString()}</td>
                    `;
                    table.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to load trades:", err);
            }
        }

        // Run bot on button click
        document.getElementById("run-bot").addEventListener("click", async () => {
            const status = document.getElementById("run-status");
            status.textContent = "Running bot...";
            try {
                const res = await fetch(backendUrl + "/run", { method: "POST" });
                const data = await res.json();
                status.textContent = "Bot executed: " + (data.trade?.action?.toUpperCase() || "No trade");
                loadTrades(); // refresh trade history
            } catch (err) {
                status.textContent = "Error running bot";
                console.error(err);
            }
        });

        loadTrades();
    </script>
</body>
</html>
