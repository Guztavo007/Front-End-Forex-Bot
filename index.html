
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forex AutoTrader PRO</title>
  <style>
    body {
      background-color: #0a1a2f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #chart, #history, #logs, #settings {
      margin-bottom: 40px;
      background-color: #142b47;
      padding: 15px;
      border-radius: 10px;
    }
    select, button {
      padding: 8px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>Forex AutoTrader PRO</h1>

  <div id="chart">
    <h2>Live Chart</h2>
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_83b48&symbol=OANDA:EURUSD&interval=30&theme=dark"
      width="100%" height="400" frameborder="0" allowtransparency="true" scrolling="no"></iframe>
  </div>

  <div id="controls">
    <label for="symbolSelector">Symbol:</label>
    <select id="symbolSelector">
      <option value="EURUSD">EUR/USD</option>
      <option value="USDJPY">USD/JPY</option>
    </select>
    <button id="runBotButton">Run Bot Now</button>
  </div>

  <script>
    document.getElementById("runBotButton").addEventListener("click", () => {
      const symbol = document.getElementById("symbolSelector").value || "EURUSD";
      const alerts = {
        enabled: true,
        trades: true,
        holds: true,
        errors: true
      };

      fetch("https://forexbot-backend.onrender.com/run", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          symbol: symbol,
          alerts: alerts
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(`Bot executed: ${data.action}`);
      })
      .catch(error => {
        alert("Error running bot: " + error.message);
      });
    });
  </script>
</body>
</html>
