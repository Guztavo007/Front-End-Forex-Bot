<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forex AutoTrader PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
  <header class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold">Forex AutoTrader PRO</h1>
      <select id="pair-select" class="bg-gray-700 text-white p-2 rounded">
        <option value="EUR_USD">EUR/USD</option>
        <option value="GBP_USD">GBP/USD</option>
        <option value="USD_JPY">USD/JPY</option>
      </select>
    </div>
    <button id="run-bot" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
      Run Bot Now
    </button>
  </header>

  <p id="run-status" class="mb-6 text-sm text-green-400"></p>

  <!-- Live Chart Placeholder -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-2">Live Chart</h2>
    <iframe id="chart-frame" class="rounded-lg" width="100%" height="400" frameborder="0"
      allowtransparency="true" scrolling="no"
      src="https://s.tradingview.com/widgetembed/?symbol=OANDA:EURUSD&interval=30&theme=dark&style=1">
    </iframe>
  </section>

  <!-- Dashboard Panels -->
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-gray-800 p-4 rounded-lg">
      <h2 class="text-xl font-bold mb-4">Bot Settings</h2>
      <label class="block mb-1">Risk Level</label>
      <input type="range" min="1" max="5" value="3" class="w-full">
    </div>
    <div class="bg-gray-800 p-4 rounded-lg">
      <h2 class="text-xl font-bold mb-4">Account Summary</h2>
      <ul class="text-gray-300 space-y-2">
  <li>Balance: <span id="balance">$0.00</span></li>
  <li>Equity: <span id="equity">$0.00</span></li>
  <li>Margin Used: <span id="marginUsed">-</span></li>
  <li>Monthly P/L: <span id="monthlyPL">$0.00</span></li>
</ul>
    </div>
  </section>

  <!-- Signal Panel -->
  <section class="mt-8 bg-gray-800 p-4 rounded-lg">
    <h2 class="text-xl font-bold mb-4">Trade Signals</h2>
    <div class="text-gray-400">No active signals</div>
  </section>

  <script>
    const backendUrl = "https://forexbot-backend.onrender.com";
    const pairSelect = document.getElementById("pair-select");
    const runStatus = document.getElementById("run-status");
    const chartFrame = document.getElementById("chart-frame");

    pairSelect.addEventListener("change", () => {
      const tvSymbol = pairSelect.value.replace("_", "");
      chartFrame.src = `https://s.tradingview.com/widgetembed/?symbol=OANDA:${tvSymbol}&interval=30&theme=dark&style=1`;
    });

    document.getElementById("run-bot").addEventListener("click", async () => {
      const symbol = pairSelect.value;
      runStatus.textContent = "Running bot for " + symbol + "...";

      try {
        const res = await fetch(backendUrl + "/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol })
        });
        const data = await res.json();
        const action = data.trade?.action?.toUpperCase() || "HOLD";
        runStatus.textContent = `Bot executed for ${symbol}: ${action}`;
      } catch (err) {
        runStatus.textContent = "Error running bot.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
