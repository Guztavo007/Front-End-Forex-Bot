
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forex AutoTrader PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">

    <header class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Forex AutoTrader PRO</h1>
        <button id="run-bot" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
            Run Bot Now
        </button>
    </header>

    <p id="run-status" class="mb-6 text-sm text-green-400"></p>

    <!-- Settings Panel -->
    <section class="mb-8 bg-gray-800 p-6 rounded-lg">
        <h2 class="text-xl font-semibold mb-4">Bot Settings</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block mb-1">Risk Level: <span id="risk-display">3</span></label>
                <input type="range" id="risk-slider" min="1" max="5" value="3" class="w-full">
            </div>
            <div>
                <label class="block mb-1">Strategy:</label>
                <select id="strategy-select" class="w-full p-2 bg-gray-700 rounded">
                    <option value="sma_rsi" selected>SMA + RSI</option>
                    <option value="rsi_only">RSI Only</option>
                    <option value="sma_only">SMA Only</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Live Chart -->
    <section class="mb-8">
        <h2 class="text-2xl font-semibold mb-2">Live EUR/USD Chart</h2>
        <div class="overflow-hidden rounded-lg">
            <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_eurusd&symbol=OANDA:EURUSD&interval=30&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=F1F3F6&studies=[]&theme=dark&style=1&timezone=Etc/UTC&withdateranges=1&hideideas=1&allow_symbol_change=1"
                width="100%" height="400" frameborder="0" allowtransparency="true" scrolling="no"></iframe>
        </div>
    </section>

    <!-- Trade History -->
    <section class="mb-8">
        <h2 class="text-2xl font-semibold mb-2">Trade History</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-800 rounded-lg overflow-hidden">
                <thead class="bg-gray-700">
                    <tr>
                        <th class="px-4 py-2 text-left">Symbol</th>
                        <th class="px-4 py-2 text-left">Action</th>
                        <th class="px-4 py-2 text-left">Price</th>
                        <th class="px-4 py-2 text-left">Timestamp</th>
                    </tr>
                </thead>
                <tbody id="trade-history" class="divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </section>

    <script>
        const backendUrl = "https://forexbot-backend.onrender.com";

        // Load trades
        async function loadTrades() {
            try {
                const res = await fetch(backendUrl + "/trades");
                const trades = await res.json();
                const table = document.getElementById("trade-history");
                table.innerHTML = "";
                trades.reverse().forEach(t => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td class="px-4 py-2">{t.symbol}</td>
                        <td class="px-4 py-2 text-${t.action === 'buy' ? 'green' : 'red'}-400 font-bold">{t.action.toUpperCase()}</td>
                        <td class="px-4 py-2">{t.price.toFixed(5)}</td>
                        <td class="px-4 py-2">{new Date(t.timestamp).toLocaleString()}</td>
                    `;
                    table.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading trades:", err);
            }
        }

        // Run bot now
        document.getElementById("run-bot").addEventListener("click", async () => {
            const status = document.getElementById("run-status");
            status.textContent = "Running bot...";
            try {
                const res = await fetch(backendUrl + "/run", { method: "POST" });
                const data = await res.json();
                const action = data.trade?.action?.toUpperCase() || "HOLD";
                status.textContent = "Bot executed: " + action;
                loadTrades();
            } catch (err) {
                status.textContent = "Error running bot.";
                console.error(err);
            }
        });

        // Update risk display
        const riskSlider = document.getElementById("risk-slider");
        const riskDisplay = document.getElementById("risk-display");
        riskSlider.addEventListener("input", () => {
            riskDisplay.textContent = riskSlider.value;
        });

        // Submit settings change
        const strategySelect = document.getElementById("strategy-select");
        [riskSlider, strategySelect].forEach(el => el.addEventListener("change", async () => {
            try {
                await fetch(backendUrl + "/settings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        risk_level: riskSlider.value,
                        strategy: strategySelect.value
                    })
                });
                console.log("Settings updated");
            } catch (err) {
                console.error("Failed to update settings:", err);
            }
        }));

        // Initial trade load
        loadTrades();
    </script>
</body>
</html>
