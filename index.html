<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forex AutoTrader PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
  <header class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold">Forex AutoTrader PRO</h1>
      <select id="pair-select" class="bg-gray-700 text-white p-2 rounded">
        <option value="EUR_USD">EUR/USD</option>
        <option value="GBP_USD">GBP/USD</option>
        <option value="USD_JPY">USD/JPY</option>
      </select>
    </div>
    <button id="run-bot" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
      Run Bot Now
    </button>
  </header>

  <p id="run-status" class="mb-6 text-sm text-green-400"></p>

  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-2">Live Chart</h2>
    <iframe id="chart-frame" class="rounded-lg" width="100%" height="400" frameborder="0"
      src="https://s.tradingview.com/widgetembed/?symbol=OANDA:EURUSD&interval=30&theme=dark&style=1"></iframe>
  </section>

  <!-- Account Summary -->
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <div class="bg-gray-800 p-4 rounded-lg">
      <h2 class="text-xl font-bold mb-4">Bot Settings</h2>
      <input type="range" min="1" max="5" value="3" class="w-full">
    </div>
    <div class="bg-gray-800 p-4 rounded-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Account Summary</h2>
        <div class="flex items-center gap-3">
          <button id="refresh-summary" class="text-blue-400 hover:underline text-sm">Refresh</button>
          <label class="text-sm text-gray-400">Auto:</label>
          <select id="refresh-interval" class="bg-gray-700 text-white text-sm rounded p-1">
            <option value="30000">30s</option>
            <option value="60000" selected>60s</option>
            <option value="120000">2m</option>
            <option value="300000">5m</option>
          </select>
        </div>
      </div>
      <ul class="text-gray-300 space-y-2">
        <li>Balance: <span id="balance">$0.00</span></li>
        <li>Equity: <span id="equity">$0.00</span></li>
        <li>Margin Used: <span id="marginUsed">-</span></li>
        <li>Monthly P/L: <span id="monthlyPL">$0.00</span></li>
      </ul>
    </div>
  </section>

  <!-- Trade History -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-2">Trade History</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-gray-800 rounded-lg overflow-hidden">
        <thead class="bg-gray-700">
          <tr>
            <th class="px-4 py-2 text-left">Symbol</th>
            <th class="px-4 py-2 text-left">Action</th>
            <th class="px-4 py-2 text-left">Price</th>
            <th class="px-4 py-2 text-left">Timestamp</th>
          </tr>
        </thead>
        <tbody id="trade-history" class="divide-y divide-gray-700"></tbody>
      </table>
    </div>
  </section>

  <!-- Logs -->
  <section class="mb-8 bg-gray-800 p-4 rounded-lg">
    <h2 class="text-2xl font-semibold mb-4">Bot Logs</h2>
    <ul id="logs" class="space-y-2 text-sm text-gray-300 overflow-auto max-h-64"></ul>
  </section>

  <script>
    const backendUrl = "https://forexbot-backend.onrender.com";
    let refreshIntervalId = null;

    const pairSelect = document.getElementById("pair-select");
    const chartFrame = document.getElementById("chart-frame");
    const intervalSelect = document.getElementById("refresh-interval");

    function setAutoRefresh(intervalMs) {
      if (refreshIntervalId) clearInterval(refreshIntervalId);
      refreshIntervalId = setInterval(loadAccountSummary, intervalMs);
    }

    document.getElementById("refresh-summary").addEventListener("click", loadAccountSummary);
    intervalSelect.addEventListener("change", e => setAutoRefresh(parseInt(e.target.value)));

    async function loadAccountSummary() {
      try {
        const res = await fetch(backendUrl + "/account-summary");
        const data = await res.json();
        document.getElementById("balance").textContent = "$" + parseFloat(data.balance).toFixed(2);
        document.getElementById("equity").textContent = "$" + parseFloat(data.equity).toFixed(2);
        document.getElementById("marginUsed").textContent = data.marginUsed;
        document.getElementById("monthlyPL").textContent = "$" + parseFloat(data.unrealizedPL).toFixed(2);
      } catch (err) {
        console.error("Account summary error", err);
      }
    }

    async function loadTrades() {
      try {
        const res = await fetch(backendUrl + "/trades");
        const trades = await res.json();
        const table = document.getElementById("trade-history");
        table.innerHTML = "";
        trades.reverse().forEach(t => {
          const row = document.createElement("tr");
          row.innerHTML = `<td class="px-4 py-2">${t.symbol}</td>
                           <td class="px-4 py-2 text-${t.action === 'buy' ? 'green' : t.action === 'sell' ? 'red' : 'gray'}-400 font-bold">${t.action.toUpperCase()}</td>
                           <td class="px-4 py-2">${parseFloat(t.price).toFixed(5)}</td>
                           <td class="px-4 py-2">${new Date(t.timestamp).toLocaleString()}</td>`;
          table.appendChild(row);
        });
      } catch (err) {
        console.error("Trade history error", err);
      }
    }

    async function loadLogs() {
      try {
        const res = await fetch(backendUrl + "/logs");
        const logs = await res.json();
        const container = document.getElementById("logs");
        container.innerHTML = "";
        logs.reverse().forEach(log => {
          const li = document.createElement("li");
          li.textContent = `[${log.timestamp}] ${log.symbol}: ${log.action.toUpperCase()} - ${log.reason}`;
          container.appendChild(li);
        });
      } catch (err) {
        console.error("Logs error", err);
      }
    }

    document.getElementById("run-bot").addEventListener("click", async () => {
      const symbol = pairSelect.value;
      document.getElementById("run-status").textContent = "Running bot...";
      const res = await fetch(backendUrl + "/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol })
      });
      const data = await res.json();
      const action = data.trade?.action?.toUpperCase() || "HOLD";
      document.getElementById("run-status").textContent = `Bot executed for ${symbol}: ${action}`;
      loadTrades();
      loadLogs();
      loadAccountSummary();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const tvSymbol = pairSelect.value.replace("_", "");
      chartFrame.src = `https://s.tradingview.com/widgetembed/?symbol=OANDA:${tvSymbol}&interval=30&theme=dark&style=1`;
      loadAccountSummary();
      loadTrades();
      loadLogs();
      setAutoRefresh(parseInt(intervalSelect.value));
    });
  </script>
</body>
</html>
